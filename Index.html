<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PESAWAT TEMPUR 2D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <!-- Overlay UI/Game Over -->
        <div id="uiOverlay" class="overlay">
            <h1 id="gameTitle">PESAWAT TEMPUR 2D</h1>
            <p id="gameMessage">Gunakan Tombol Panah Kiri/Kanan & Spasi untuk Menembak</p>
            
            <div id="inputSection">
                <input type="text" id="playerName" placeholder="Masukkan Nama Anda" maxlength="10">
                <button id="startBtn">Mulai Game</button>
            </div>

            <div id="leaderboardSection">
                <h2>Top 5 Leaderboard</h2>
                <ol id="leaderboardList">
                    <li>Loading...</li>
                </ol>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
